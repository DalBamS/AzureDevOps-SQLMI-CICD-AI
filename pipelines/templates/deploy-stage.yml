parameters:
  - name: stageName
    type: string
  - name: displayName
    type: string
  - name: environmentName
    type: string
  - name: variableGroup
    type: string
  - name: agentPool
    type: string
  - name: azureServiceConnection
    type: string
  - name: publishProfile
    type: string
  - name: sqlCommandTimeout
    type: number
    default: 3600
  - name: maxParallel
    type: number
    default: 4
  - name: validateAllDatabasePlans
    type: boolean
    default: false
  - name: databasePlanDriftPolicy
    type: string
    default: Warn
    values:
      - Warn
      - Fail
  - name: deployInstanceObjects
    type: boolean
    default: false
  - name: deploymentMode
    type: string
    default: Publish
  - name: enableAiReview
    type: boolean
  - name: aiEndpoint
    type: string
  - name: aiDeploymentName
    type: string
  - name: enabled
    type: boolean
  - name: dependsOn
    type: string

stages:
  - stage: Plan${{ parameters.stageName }}
    displayName: Plan ${{ parameters.displayName }}
    dependsOn: ${{ parameters.dependsOn }}
    condition: |
      and(
        in(dependencies.${{ parameters.dependsOn }}.result, 'Succeeded', 'SucceededWithIssues'),
        eq('${{ parameters.enabled }}', 'True')
      )
    variables:
      - group: ${{ parameters.variableGroup }}
    jobs:
      - job: GeneratePlan
        displayName: Generate deployment review artifacts
        pool:
          name: ${{ parameters.agentPool }}
        steps:
          - checkout: self

          - download: current
            artifact: database

          - task: UseDotNet@2
            displayName: Use .NET 10 SDK
            inputs:
              packageType: sdk
              version: 10.x

          - pwsh: |
              $toolPath = Join-Path "$(Agent.TempDirectory)" "sqlpackage"
              dotnet tool install `
                --tool-path $toolPath `
                Microsoft.SqlPackage `
                --version "$(sqlPackageVersion)" `
                --allow-roll-forward
              if ($LASTEXITCODE -ne 0) {
                throw "SqlPackage installation failed."
              }
            displayName: Install pinned SqlPackage

          - pwsh: |
              $requiredVersion = [version]"$(sqlServerModuleVersion)"
              $installed = Get-Module -ListAvailable -Name SqlServer |
                Where-Object Version -eq $requiredVersion
              if (-not $installed) {
                Install-Module `
                  -Name SqlServer `
                  -RequiredVersion $requiredVersion `
                  -Repository PSGallery `
                  -Scope CurrentUser `
                  -Force `
                  -AllowClobber
              }
              Import-Module SqlServer -RequiredVersion $requiredVersion -Force
            displayName: Prepare pinned SQL plan module

          - task: AzureCLI@2
            displayName: Generate representative deployment plan
            inputs:
              azureSubscription: ${{ parameters.azureServiceConnection }}
              keepAzSessionActive: true
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: |
                $ErrorActionPreference = "Stop"
                $sqlPackage = Join-Path "$(Agent.TempDirectory)" "sqlpackage/sqlpackage"
                if ($IsWindows) {
                  $sqlPackage += ".exe"
                }
                $reviewPath = Join-Path "$(Pipeline.Workspace)" "deployment-review/${{ parameters.environmentName }}"
                $summaryPath = Join-Path "$(Agent.TempDirectory)" "plan-summary-${{ parameters.environmentName }}.md"
                try {
                  ./eng/New-DatabaseDeploymentPlan.ps1 `
                    -ServerName "$(sqlServer)" `
                    -Port "$(sqlPort)" `
                    -DatabaseName $env:databaseName `
                    -DatabaseNames $env:databaseNames `
                    -DacpacPath "$(Pipeline.Workspace)/database/App.Database.dacpac" `
                    -PublishProfilePath "${{ parameters.publishProfile }}" `
                    -SqlPackagePath $sqlPackage `
                    -AccessTokenProviderPath "./eng/Get-AzureSqlAccessToken.ps1" `
                    -ReviewPath $reviewPath `
                    -CommandTimeout ${{ parameters.sqlCommandTimeout }} `
                    -ValidateAllDatabasePlans:([bool]::Parse($env:validateAllDatabasePlans)) `
                    -DatabasePlanDriftPolicy "${{ parameters.databasePlanDriftPolicy }}" `
                    -SummaryPath $summaryPath `
                    -EnvironmentName "${{ parameters.environmentName }}"
                }
                finally {
                  if (Test-Path $summaryPath) {
                    Write-Host "##vso[task.uploadsummary]$summaryPath"
                  }
                }
            env:
              databaseName: $(databaseName)
              databaseNames: $(databaseNames)
              validateAllDatabasePlans: ${{ parameters.validateAllDatabasePlans }}
              SQLSERVER_MODULE_VERSION: $(sqlServerModuleVersion)

          - task: AzureCLI@2
            displayName: Run advisory AI review of deployment SQL
            condition: and(succeeded(), eq('${{ parameters.enableAiReview }}', 'True'))
            continueOnError: true
            inputs:
              azureSubscription: ${{ parameters.azureServiceConnection }}
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: |
                $reviewPath = Join-Path "$(Pipeline.Workspace)" "deployment-review/${{ parameters.environmentName }}"
                Remove-Item -Path "$reviewPath/ai-review.json" -Force -ErrorAction SilentlyContinue
                Remove-Item -Path "$reviewPath/ai-review.md" -Force -ErrorAction SilentlyContinue
                ./eng/Invoke-AiDatabaseReview.ps1 `
                  -DeploymentScriptPath "$reviewPath/deploy.sql" `
                  -OutputPath "$reviewPath/ai-review.json"
            env:
              AZURE_OPENAI_ENDPOINT: ${{ parameters.aiEndpoint }}
              AZURE_OPENAI_DEPLOYMENT: ${{ parameters.aiDeploymentName }}

          - publish: $(Pipeline.Workspace)/deployment-review/${{ parameters.environmentName }}
            artifact: deployment-review-${{ parameters.environmentName }}
            displayName: Publish deployment review artifacts
            condition: succeededOrFailed()

  - stage: Deploy${{ parameters.stageName }}
    displayName: ${{ parameters.displayName }}
    dependsOn: Plan${{ parameters.stageName }}
    condition: succeeded()
    lockBehavior: sequential
    variables:
      - group: ${{ parameters.variableGroup }}
    jobs:
      - deployment: DeployDacpac
        displayName: Canary and fan-out approved DACPAC
        environment: ${{ parameters.environmentName }}
        pool:
          name: ${{ parameters.agentPool }}
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - download: current
                  artifact: database

                - pwsh: |
                    $reviewDownloadPath = "$(Pipeline.Workspace)/deployment-review-${{ parameters.environmentName }}"
                    Remove-Item -Path $reviewDownloadPath -Recurse -Force -ErrorAction SilentlyContinue
                  displayName: Clear previous deployment review download

                - download: current
                  artifact: deployment-review-${{ parameters.environmentName }}

                - task: UseDotNet@2
                  displayName: Use .NET 10 SDK
                  inputs:
                    packageType: sdk
                    version: 10.x

                - pwsh: |
                    $toolPath = Join-Path "$(Agent.TempDirectory)" "sqlpackage"
                    dotnet tool install `
                      --tool-path $toolPath `
                      Microsoft.SqlPackage `
                      --version "$(sqlPackageVersion)" `
                      --allow-roll-forward
                    if ($LASTEXITCODE -ne 0) {
                      throw "SqlPackage installation failed."
                    }
                  displayName: Install pinned SqlPackage

                - ${{ if eq(parameters.deploymentMode, 'ValidatedScript') }}:
                    - pwsh: |
                        $requiredVersion = [version]"$(sqlServerModuleVersion)"
                        $installed = Get-Module -ListAvailable -Name SqlServer |
                          Where-Object Version -eq $requiredVersion
                        if (-not $installed) {
                          Install-Module `
                            -Name SqlServer `
                            -RequiredVersion $requiredVersion `
                            -Repository PSGallery `
                            -Scope CurrentUser `
                            -Force `
                            -AllowClobber
                        }
                        Import-Module SqlServer -RequiredVersion $requiredVersion -Force
                      displayName: Prepare validated-script SQL module

                - pwsh: |
                    $markerDirectory = "$(Pipeline.Workspace)/deployment-review-pitr/${{ parameters.environmentName }}"
                    New-Item -ItemType Directory -Path $markerDirectory -Force | Out-Null
                    ./eng/New-PitrMarker.ps1 `
                      -DatabaseName $env:databaseName `
                      -DatabaseNames $env:databaseNames `
                      -ServerName "$(sqlServer)" `
                      -EnvironmentName "${{ parameters.environmentName }}" `
                      -OutputPath "$(Pipeline.Workspace)/deployment-review-pitr/${{ parameters.environmentName }}/pitr-marker.json" `
                      -BuildId "$(Build.BuildId)" `
                      -SourceVersion "$(Build.SourceVersion)"
                    Write-Host "##vso[task.setvariable variable=pitrMarkerCreated]true"
                  displayName: Capture pre-deployment UTC PITR marker
                  env:
                    databaseName: $(databaseName)
                    databaseNames: $(databaseNames)

                - task: AzureCLI@2
                  displayName: Deploy canary, test, then fan out
                  inputs:
                    azureSubscription: ${{ parameters.azureServiceConnection }}
                    keepAzSessionActive: true
                    scriptType: pscore
                    scriptLocation: inlineScript
                    inlineScript: |
                      $ErrorActionPreference = "Stop"
                      $sqlPackage = Join-Path "$(Agent.TempDirectory)" "sqlpackage/sqlpackage"
                      if ($IsWindows) {
                        $sqlPackage += ".exe"
                      }
                      $summaryPath = Join-Path "$(Agent.TempDirectory)" "deploy-summary-${{ parameters.environmentName }}.md"
                      try {
                        ./eng/Deploy-Databases.ps1 `
                          -ServerName "$(sqlServer)" `
                          -Port "$(sqlPort)" `
                          -DatabaseName $env:databaseName `
                          -DatabaseNames $env:databaseNames `
                          -DacpacPath "$(Pipeline.Workspace)/database/App.Database.dacpac" `
                          -PublishProfilePath "${{ parameters.publishProfile }}" `
                          -SqlPackagePath $sqlPackage `
                          -ApprovedReportPath "$(Pipeline.Workspace)/deployment-review-${{ parameters.environmentName }}/deploy-report.xml" `
                          -AccessTokenProviderPath "./eng/Get-AzureSqlAccessToken.ps1" `
                          -DeploymentMode "${{ parameters.deploymentMode }}" `
                          -CommandTimeout ${{ parameters.sqlCommandTimeout }} `
                          -MaxParallel ${{ parameters.maxParallel }} `
                          -ValidateAllDatabasePlans:([bool]::Parse($env:validateAllDatabasePlans)) `
                          -ReportDirectory "$(Agent.TempDirectory)/database-deploy-reports" `
                          -SummaryPath $summaryPath `
                          -EnvironmentName "${{ parameters.environmentName }}"
                      }
                      finally {
                        if (Test-Path $summaryPath) {
                          Write-Host "##vso[task.uploadsummary]$summaryPath"
                        }
                      }
                  env:
                    databaseName: $(databaseName)
                    databaseNames: $(databaseNames)
                    validateAllDatabasePlans: ${{ parameters.validateAllDatabasePlans }}
                    SQLSERVER_MODULE_VERSION: $(sqlServerModuleVersion)

                - task: PublishPipelineArtifact@1
                  displayName: Publish PITR marker
                  condition: and(always(), eq(variables['pitrMarkerCreated'], 'true'))
                  inputs:
                    targetPath: $(Pipeline.Workspace)/deployment-review-pitr/${{ parameters.environmentName }}
                    artifactName: deployment-review-${{ parameters.environmentName }}-pitr-marker-$(System.JobAttempt)

      - job: DeployInstanceObjects
        displayName: Deploy SQL MI instance objects
        dependsOn: DeployDacpac
        condition: and(succeeded(), eq('${{ parameters.deployInstanceObjects }}', 'True'))
        pool:
          name: ${{ parameters.agentPool }}
        steps:
          - checkout: self

          - pwsh: |
              $requiredVersion = [version]"$(sqlServerModuleVersion)"
              $installed = Get-Module -ListAvailable -Name SqlServer |
                Where-Object Version -eq $requiredVersion
              if (-not $installed) {
                Install-Module `
                  -Name SqlServer `
                  -RequiredVersion $requiredVersion `
                  -Repository PSGallery `
                  -Scope CurrentUser `
                  -Force `
                  -AllowClobber
              }
              Import-Module SqlServer -RequiredVersion $requiredVersion -Force
            displayName: Prepare pinned SQL module

          - task: AzureCLI@2
            displayName: Execute idempotent instance object scripts
            inputs:
              azureSubscription: ${{ parameters.azureServiceConnection }}
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: |
                $ErrorActionPreference = "Stop"
                $token = (az account get-access-token `
                  --resource "https://database.windows.net/" `
                  --query accessToken `
                  --output tsv).Trim()
                if (-not $token) {
                  throw "Unable to acquire an Azure SQL access token."
                }

                ./eng/Deploy-InstanceObjects.ps1 `
                  -ServerName "$(sqlServer)" `
                  -Port "$(sqlPort)" `
                  -AccessToken $token `
                  -SqlcmdVariables @{
                    EntraLoginName = $env:instanceEntraLoginName
                    AgentJobName = $env:instanceAgentJobName
                    AgentJobOwner = $env:instanceAgentJobOwner
                  } `
                  -Confirm:$false
            env:
              instanceEntraLoginName: $(instanceEntraLoginName)
              instanceAgentJobName: $(instanceAgentJobName)
              instanceAgentJobOwner: $(instanceAgentJobOwner)
              SQLSERVER_MODULE_VERSION: $(sqlServerModuleVersion)
