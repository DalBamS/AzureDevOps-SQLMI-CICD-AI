parameters:
  - name: stageName
    type: string
  - name: displayName
    type: string
  - name: environmentName
    type: string
  - name: variableGroup
    type: string
  - name: agentPool
    type: string
  - name: azureServiceConnection
    type: string
  - name: publishProfile
    type: string
  - name: sqlCommandTimeout
    type: number
    default: 3600
  - name: enableAiReview
    type: boolean
  - name: aiEndpoint
    type: string
  - name: aiDeploymentName
    type: string
  - name: enabled
    type: boolean
  - name: dependsOn
    type: string

stages:
  - stage: Plan${{ parameters.stageName }}
    displayName: Plan ${{ parameters.displayName }}
    dependsOn: ${{ parameters.dependsOn }}
    condition: |
      and(
        in(dependencies.${{ parameters.dependsOn }}.result, 'Succeeded', 'SucceededWithIssues'),
        eq('${{ parameters.enabled }}', 'True')
      )
    variables:
      - group: ${{ parameters.variableGroup }}
    jobs:
      - job: GeneratePlan
        displayName: Generate deployment review artifacts
        pool:
          name: ${{ parameters.agentPool }}
        steps:
          - checkout: self

          - download: current
            artifact: database

          - task: UseDotNet@2
            displayName: Use .NET 10 SDK
            inputs:
              packageType: sdk
              version: 10.x

          - pwsh: |
              $toolPath = Join-Path "$(Agent.TempDirectory)" "sqlpackage"
              dotnet tool install `
                --tool-path $toolPath `
                Microsoft.SqlPackage `
                --version "$(sqlPackageVersion)" `
                --allow-roll-forward
              if ($LASTEXITCODE -ne 0) {
                throw "SqlPackage installation failed."
              }
            displayName: Install pinned SqlPackage

          - task: AzureCLI@2
            displayName: Generate deployment script and report
            inputs:
              azureSubscription: ${{ parameters.azureServiceConnection }}
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: |
                $ErrorActionPreference = "Stop"
                $sqlPackage = Join-Path "$(Agent.TempDirectory)" "sqlpackage/sqlpackage"
                if ($IsWindows) {
                  $sqlPackage += ".exe"
                }

                $token = (az account get-access-token `
                  --resource "https://database.windows.net/" `
                  --query accessToken `
                  --output tsv).Trim()
                if (-not $token) {
                  throw "Unable to acquire an Azure SQL access token."
                }

                $reviewPath = Join-Path "$(Pipeline.Workspace)" "deployment-review/${{ parameters.environmentName }}"
                New-Item -ItemType Directory -Force -Path $reviewPath | Out-Null
                $dacpac = "$(Pipeline.Workspace)/database/App.Database.dacpac"
                $publishProfile = Join-Path "$(Build.SourcesDirectory)" "${{ parameters.publishProfile }}"
                $connection = "Server=tcp:$(sqlServer),$(sqlPort);Initial Catalog=$(databaseName);Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;"
                $commandTimeout = 0
                if (-not [int]::TryParse($env:sqlCommandTimeout, [ref]$commandTimeout) -or $commandTimeout -lt 1) {
                  throw "sqlCommandTimeout must be a positive integer."
                }
                if (-not (Test-Path $publishProfile -PathType Leaf)) {
                  throw "Publish profile not found: $publishProfile"
                }

                & $sqlPackage `
                  /Action:Script `
                  "/SourceFile:$dacpac" `
                  "/TargetConnectionString:$connection" `
                  "/AccessToken:$token" `
                  "/OutputPath:$reviewPath/deploy.sql" `
                  "/Profile:$publishProfile" `
                  "/p:CommandTimeout=$commandTimeout"
                if ($LASTEXITCODE -ne 0) {
                  throw "Deployment script generation failed."
                }

                ./eng/Test-DeploymentScript.ps1 `
                  -ScriptPath "$reviewPath/deploy.sql" `
                  -ReportPath "$reviewPath/deployment-script-policy.md"

                & $sqlPackage `
                  /Action:DeployReport `
                  "/SourceFile:$dacpac" `
                  "/TargetConnectionString:$connection" `
                  "/AccessToken:$token" `
                  "/OutputPath:$reviewPath/deploy-report.xml" `
                  "/Profile:$publishProfile" `
                  "/p:CommandTimeout=$commandTimeout"
                if ($LASTEXITCODE -ne 0) {
                  throw "Deployment report generation failed."
                }
            env:
              sqlCommandTimeout: ${{ parameters.sqlCommandTimeout }}

          - task: AzureCLI@2
            displayName: Run advisory AI review of deployment SQL
            condition: and(succeeded(), eq('${{ parameters.enableAiReview }}', 'True'))
            continueOnError: true
            inputs:
              azureSubscription: ${{ parameters.azureServiceConnection }}
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: |
                $reviewPath = Join-Path "$(Pipeline.Workspace)" "deployment-review/${{ parameters.environmentName }}"
                ./eng/Invoke-AiDatabaseReview.ps1 `
                  -DeploymentScriptPath "$reviewPath/deploy.sql" `
                  -OutputPath "$reviewPath/ai-review.json"
            env:
              AZURE_OPENAI_ENDPOINT: ${{ parameters.aiEndpoint }}
              AZURE_OPENAI_DEPLOYMENT: ${{ parameters.aiDeploymentName }}

          - publish: $(Pipeline.Workspace)/deployment-review/${{ parameters.environmentName }}
            artifact: deployment-review-${{ parameters.environmentName }}
            displayName: Publish deployment review artifacts
            condition: succeededOrFailed()

  - stage: Deploy${{ parameters.stageName }}
    displayName: ${{ parameters.displayName }}
    dependsOn: Plan${{ parameters.stageName }}
    condition: succeeded()
    lockBehavior: sequential
    variables:
      - group: ${{ parameters.variableGroup }}
    jobs:
      - deployment: DeployDacpac
        displayName: Publish approved DACPAC
        environment: ${{ parameters.environmentName }}
        pool:
          name: ${{ parameters.agentPool }}
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - download: current
                  artifact: database

                - download: current
                  artifact: deployment-review-${{ parameters.environmentName }}

                - task: UseDotNet@2
                  displayName: Use .NET 10 SDK
                  inputs:
                    packageType: sdk
                    version: 10.x

                - pwsh: |
                    $toolPath = Join-Path "$(Agent.TempDirectory)" "sqlpackage"
                    dotnet tool install `
                      --tool-path $toolPath `
                      Microsoft.SqlPackage `
                      --version "$(sqlPackageVersion)" `
                      --allow-roll-forward
                    if ($LASTEXITCODE -ne 0) {
                      throw "SqlPackage installation failed."
                    }
                  displayName: Install pinned SqlPackage

                - pwsh: |
                    $requiredVersion = [version]"$(sqlServerModuleVersion)"
                    $installed = Get-Module -ListAvailable -Name SqlServer |
                      Where-Object Version -eq $requiredVersion
                    if (-not $installed) {
                      Install-Module `
                        -Name SqlServer `
                        -RequiredVersion $requiredVersion `
                        -Repository PSGallery `
                        -Scope CurrentUser `
                        -Force `
                        -AllowClobber
                    }
                    Import-Module SqlServer -RequiredVersion $requiredVersion -Force
                  displayName: Prepare pinned SQL test module

                - task: AzureCLI@2
                  displayName: Deploy and smoke test approved DACPAC
                  inputs:
                    azureSubscription: ${{ parameters.azureServiceConnection }}
                    scriptType: pscore
                    scriptLocation: inlineScript
                    inlineScript: |
                      $ErrorActionPreference = "Stop"
                      $sqlPackage = Join-Path "$(Agent.TempDirectory)" "sqlpackage/sqlpackage"
                      if ($IsWindows) {
                        $sqlPackage += ".exe"
                      }

                      $token = (az account get-access-token `
                        --resource "https://database.windows.net/" `
                        --query accessToken `
                        --output tsv).Trim()
                      if (-not $token) {
                        throw "Unable to acquire an Azure SQL access token."
                      }

                      $dacpac = "$(Pipeline.Workspace)/database/App.Database.dacpac"
                      $publishProfile = Join-Path "$(Build.SourcesDirectory)" "${{ parameters.publishProfile }}"
                      $connection = "Server=tcp:$(sqlServer),$(sqlPort);Initial Catalog=$(databaseName);Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;"
                      $approvedReport = "$(Pipeline.Workspace)/deployment-review-${{ parameters.environmentName }}/deploy-report.xml"
                      $currentReport = "$(Agent.TempDirectory)/current-deploy-report.xml"
                      $commandTimeout = 0
                      if (-not [int]::TryParse($env:sqlCommandTimeout, [ref]$commandTimeout) -or $commandTimeout -lt 1) {
                        throw "sqlCommandTimeout must be a positive integer."
                      }
                      if (-not (Test-Path $publishProfile -PathType Leaf)) {
                        throw "Publish profile not found: $publishProfile"
                      }

                      & $sqlPackage `
                        /Action:DeployReport `
                        "/SourceFile:$dacpac" `
                        "/TargetConnectionString:$connection" `
                        "/AccessToken:$token" `
                        "/OutputPath:$currentReport" `
                        "/Profile:$publishProfile" `
                        "/p:CommandTimeout=$commandTimeout"
                      if ($LASTEXITCODE -ne 0) {
                        throw "Current deployment report generation failed."
                      }

                      ./eng/Confirm-DeploymentPlan.ps1 `
                        -ApprovedReportPath $approvedReport `
                        -CurrentReportPath $currentReport

                      & $sqlPackage `
                        /Action:Publish `
                        "/SourceFile:$dacpac" `
                        "/TargetConnectionString:$connection" `
                        "/AccessToken:$token" `
                        "/Profile:$publishProfile" `
                        "/p:CommandTimeout=$commandTimeout"
                      if ($LASTEXITCODE -ne 0) {
                        throw "DACPAC deployment failed."
                      }

                      ./eng/Test-DeployedDatabase.ps1 `
                        -ServerName "$(sqlServer)" `
                        -Port "$(sqlPort)" `
                        -DatabaseName "$(databaseName)" `
                        -AccessToken $token
                  env:
                    sqlCommandTimeout: ${{ parameters.sqlCommandTimeout }}
