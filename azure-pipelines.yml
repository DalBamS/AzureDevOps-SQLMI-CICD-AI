trigger:
  branches:
    include:
      - main
  paths:
    include:
      - database/**
      - eng/**
      - tests/**
      - pipelines/**
      - ai/**
      - azure-pipelines.yml

pr:
  branches:
    include:
      - main

parameters:
  - name: deployDev
    displayName: Deploy to Dev
    type: boolean
    default: false
  - name: deployTest
    displayName: Deploy to Test
    type: boolean
    default: false
  - name: deployProd
    displayName: Deploy to Production
    type: boolean
    default: false
  - name: privateAgentPool
    displayName: SQL MI private agent pool
    type: string
    default: sqlmi-private-agents
  - name: azureServiceConnection
    displayName: Azure workload identity service connection
    type: string
    default: sc-sqlmi-wif
  - name: enableAiReview
    displayName: Run advisory AI SQL review
    type: boolean
    default: false
  - name: aiEndpoint
    displayName: Azure OpenAI endpoint
    type: string
    default: ''
  - name: aiDeploymentName
    displayName: Azure OpenAI model deployment
    type: string
    default: sql-review
  - name: publishAiPrComment
    displayName: Publish AI review as a GitHub PR comment
    type: boolean
    default: false
  - name: githubServiceConnection
    displayName: GitHub service connection for PR comments
    type: string
    default: ''

variables:
  artifactName: database
  sqlPackageVersion: 170.4.83

stages:
  - stage: Build
    displayName: Build and validate
    jobs:
      - job: BuildDacpac
        displayName: Build DACPAC
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
            fetchDepth: 0

          - task: UseDotNet@2
            displayName: Use .NET 10 SDK
            inputs:
              packageType: sdk
              version: 10.x

          - pwsh: ./eng/Build.ps1 -DacVersion "1.0.$(Build.BuildId).0"
            displayName: Build SQL project

          - pwsh: ./eng/Test-SqlPolicy.ps1
            displayName: Run deterministic SQL policy

          - task: AzureCLI@2
            displayName: Run advisory AI review of PR SQL changes
            condition: |
              and(
                succeeded(),
                eq('${{ parameters.enableAiReview }}', 'True'),
                eq(variables['Build.Reason'], 'PullRequest')
              )
            continueOnError: true
            inputs:
              azureSubscription: ${{ parameters.azureServiceConnection }}
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: |
                ./eng/Invoke-AiDatabaseReview.ps1 `
                  -BaseRef "HEAD^1" `
                  -OutputPath "artifacts/ai-review/pr-review.json"
            env:
              AZURE_OPENAI_ENDPOINT: ${{ parameters.aiEndpoint }}
              AZURE_OPENAI_DEPLOYMENT: ${{ parameters.aiDeploymentName }}

          - ${{ if eq(parameters.publishAiPrComment, true) }}:
              - task: GitHubComment@0
                displayName: Publish AI review to GitHub PR
                condition: |
                  and(
                    succeededOrFailed(),
                    eq('${{ parameters.enableAiReview }}', 'True'),
                    eq(variables['Build.Reason'], 'PullRequest'),
                    ne(variables['aiReviewComment'], '')
                  )
                continueOnError: true
                inputs:
                  gitHubConnection: ${{ parameters.githubServiceConnection }}
                  repositoryName: $(Build.Repository.Name)
                  comment: $(aiReviewComment)

          - publish: artifacts/dacpac
            artifact: $(artifactName)
            displayName: Publish immutable DACPAC

          - publish: artifacts/sql-policy-report.md
            artifact: sql-policy-report
            displayName: Publish policy report

          - publish: artifacts/ai-review
            artifact: ai-pr-review
            displayName: Publish AI PR review
            condition: |
              and(
                succeededOrFailed(),
                eq('${{ parameters.enableAiReview }}', 'True'),
                eq(variables['Build.Reason'], 'PullRequest')
              )
            continueOnError: true

      - job: IntegrationTest
        displayName: Deploy and smoke test SQL Server 2022
        dependsOn: BuildDacpac
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: UseDotNet@2
            displayName: Use .NET 10 SDK
            inputs:
              packageType: sdk
              version: 10.x

          - download: current
            artifact: $(artifactName)

          - pwsh: |
              New-Item -ItemType Directory -Force -Path artifacts/dacpac | Out-Null
              Copy-Item "$(Pipeline.Workspace)/$(artifactName)/App.Database.dacpac" artifacts/dacpac/
              ./eng/Test-Database.ps1 -SkipBuild
            displayName: Run database integration tests

  - template: pipelines/templates/deploy-stage.yml
    parameters:
      stageName: Dev
      displayName: Deploy Dev
      environmentName: sqlmi-dev
      variableGroup: sqlmi-dev
      agentPool: ${{ parameters.privateAgentPool }}
      azureServiceConnection: ${{ parameters.azureServiceConnection }}
      enableAiReview: ${{ parameters.enableAiReview }}
      aiEndpoint: ${{ parameters.aiEndpoint }}
      aiDeploymentName: ${{ parameters.aiDeploymentName }}
      enabled: ${{ parameters.deployDev }}
      dependsOn: Build

  - template: pipelines/templates/deploy-stage.yml
    parameters:
      stageName: Test
      displayName: Deploy Test
      environmentName: sqlmi-test
      variableGroup: sqlmi-test
      agentPool: ${{ parameters.privateAgentPool }}
      azureServiceConnection: ${{ parameters.azureServiceConnection }}
      enableAiReview: ${{ parameters.enableAiReview }}
      aiEndpoint: ${{ parameters.aiEndpoint }}
      aiDeploymentName: ${{ parameters.aiDeploymentName }}
      enabled: ${{ and(parameters.deployDev, parameters.deployTest) }}
      dependsOn: DeployDev

  - template: pipelines/templates/deploy-stage.yml
    parameters:
      stageName: Prod
      displayName: Deploy Production
      environmentName: sqlmi-prod
      variableGroup: sqlmi-prod
      agentPool: ${{ parameters.privateAgentPool }}
      azureServiceConnection: ${{ parameters.azureServiceConnection }}
      enableAiReview: ${{ parameters.enableAiReview }}
      aiEndpoint: ${{ parameters.aiEndpoint }}
      aiDeploymentName: ${{ parameters.aiDeploymentName }}
      enabled: ${{ and(parameters.deployDev, parameters.deployTest, parameters.deployProd) }}
      dependsOn: DeployTest
